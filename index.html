<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>臨床教師認證</title>
  <!-- 版本號用來避免瀏覽器沿用舊的快取檔；更新程式時一併更換 -->
  <link rel="stylesheet" href="app.css?v=20261021d">
  <link rel="icon" type="image/png" href="favicon.png?v=20261021d">
</head>
<body>

  <!-- 登入／開通 -->
  <main id="authView" class="auth" hidden>
    <div class="auth-card">
      <img class="auth-logo" src="logo.png?v=20261021d" alt="中國醫藥大學附設醫院 師資培育中心 Center for Faculty Development" width="1263" height="170">
      <h1>臨床教師認證</h1>

      <!-- 所有同仁：員工編號＋身分證後 4 碼登入（不必開通、不必設密碼）；師培中心管理者另以密碼登入 -->
      <div id="authMain">
      <div class="tabs" role="tablist" hidden>
        <button id="tabLogin" class="tab is-active" role="tab" type="button">登入</button>
        <button id="tabActivate" class="tab" role="tab" type="button">忘記密碼</button>
      </div>

      <form id="loginForm" autocomplete="off">
        <p id="loginHint" class="hint">輸入<b>員工編號</b>與<b>身分證字號最後 4 碼</b>即可登入，不需要開通帳號或設定密碼。</p>
        <label>員工編號<input id="loginEmp" type="text" autocomplete="username" required></label>
        <label id="loginL4L">身分證字號（或居留證號）最後 4 碼<input id="loginL4" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required></label>
        <label id="loginPwL" hidden>密碼<input id="loginPw" type="password" autocomplete="current-password"></label>
        <button class="btn btn-primary" type="submit">登入</button>
        <p class="hint">連續輸入錯誤 5 次會暫停一段時間。使用公用電腦時，用完請按右上角「登出」。</p>
        <p class="hint" style="text-align:center"><button id="pwToggle" class="btn-link" type="button">師培中心管理者：用密碼登入</button>
          <button id="pwForgot" class="btn-link" type="button" hidden>忘記密碼</button></p>
      </form>

      <form id="activateForm" hidden autocomplete="off">
        <p id="actHint" class="hint">第一次使用或忘記密碼：輸入員工編號與身分證字號，再自訂密碼即可。</p>
        <label>員工編號<input id="actEmp" type="text" required></label>
        <label id="actIdL">身分證字號（或居留證號）<input id="actId" type="password" autocomplete="off" required style="text-transform:uppercase;"></label>
        <label id="actCodeL" hidden>開通碼<input id="actCode" type="text" maxlength="8" style="letter-spacing:.2em;text-transform:uppercase;"></label>
        <label>自訂密碼（至少 8 個字元）<input id="actPw" type="password" minlength="8" autocomplete="new-password" required></label>
        <label>再輸入一次<input id="actPw2" type="password" minlength="8" autocomplete="new-password" required></label>
        <button class="btn btn-primary" type="submit">重設密碼並登入</button>
        <p class="hint" style="text-align:center"><button id="wayToggle" class="btn-link" type="button">名冊沒有我的證號資料？改用師培中心發的開通碼</button>
          <br><button id="backLogin" class="btn-link" type="button">← 回到登入</button></p>
      </form>
      </div>

      <div id="lookupPane" hidden>
        <button id="lkBackLogin" class="btn-link" type="button">← 返回</button>
        <h2 class="lk-pane-title">查詢我的認證進度</h2>
      <form id="lookupForm" autocomplete="off">
        <p class="hint">不用帳號，即可查詢自己的認證狀態、效期、點數與修課紀錄（唯讀）。</p>
        <label>員工編號<input id="lkEmp" type="text" required></label>
        <label>身分證字號（或居留證號）最後 4 碼<input id="lkLast4" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off"></label>
        <button class="btn btn-primary" type="submit">查詢我的進度</button>
        <p class="hint">連續輸入錯誤 5 次會暫停查詢一段時間。</p>
      </form>
      </div>

      <p id="authMsg" class="msg" role="alert"></p>
    </div>
  </main>

  <!-- 免登入查詢結果（唯讀） -->
  <div id="lookupView" hidden>
    <header class="topbar">
      <div class="brand"><img class="brand-mark" src="logo-mark.png?v=20261021d" alt="" width="128" height="128">臨床教師認證｜進度查詢</div>
      <div class="who"><span id="lkWho"></span><button class="btn btn-ghost" type="button" onclick="openFeedback('lookup')">問題反映</button><button id="lkEnd" class="btn btn-ghost" type="button">結束查詢</button></div>
    </header>
    <main id="lkContent" class="content"></main>
    <footer class="foot">資料更新時間：<span id="lkAsOf">—</span>。如資料有疑問，請洽師培中心。</footer>
  </div>

  <!-- 主畫面 -->
  <div id="appView" hidden>
    <header class="topbar">
      <div class="brand"><img class="brand-mark" src="logo-mark.png?v=20261021d" alt="" width="128" height="128">臨床教師認證</div>
      <nav id="nav" class="nav"></nav>
      <!-- 師培中心、科部主管：以員工編號直接查個人進度 -->
      <form id="empSearch" class="emp-search" role="search" hidden autocomplete="off">
        <input id="empQ" type="search" placeholder="員工編號查詢個人進度" aria-label="員工編號" enterkeyhint="search">
        <button class="btn" type="submit">查詢</button>
      </form>
      <div class="who">
        <span id="whoText"></span>
        <button id="pwBtn" class="btn btn-ghost" type="button">變更密碼</button>
        <button id="logoutBtn" class="btn btn-ghost" type="button">登出</button>
      </div>
    </header>
    <main id="content" class="content"></main>
    <footer class="foot">資料更新時間：<span id="asOf">—</span>。姓名僅本人、所屬科部管理人與師培中心可見；身分證字號不存放於本站。</footer>
  </div>

  <!-- 右下角的小機器人：問題反映／諮詢（免登入查詢者與一般登入者） -->
  <button id="fbFab" class="fab" type="button" hidden aria-label="問題反映／諮詢">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <line x1="32" y1="6" x2="32" y2="14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="5" r="3.5" fill="#FFCB0D"/>
      <rect x="10" y="14" width="44" height="34" rx="12" fill="#fff"/>
      <rect x="4" y="26" width="6" height="12" rx="3" fill="#fff"/><rect x="54" y="26" width="6" height="12" rx="3" fill="#fff"/>
      <circle cx="24" cy="30" r="5" fill="#164661"/><circle cx="40" cy="30" r="5" fill="#164661"/>
      <circle cx="25.5" cy="28.5" r="1.6" fill="#fff"/><circle cx="41.5" cy="28.5" r="1.6" fill="#fff"/>
      <path d="M24 40 Q32 46 40 40" stroke="#164661" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M22 48 L20 58 L30 50 Z" fill="#fff"/>
    </svg>
    <span class="fab-tip">有問題嗎？點我反映</span>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="config.js?v=20261021d"></script>
  <script src="app.js?v=20261021d"></script>
</body>
</html>
