<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>臨床教師認證</title>
  <!-- 版本號用來避免瀏覽器沿用舊的快取檔；更新程式時一併更換 -->
  <link rel="stylesheet" href="app.css?v=20261008a">
  <link rel="icon" type="image/png" href="favicon.png?v=20261008a">
</head>
<body>

  <!-- 登入／開通 -->
  <main id="authView" class="auth" hidden>
    <div class="auth-card">
      <img class="auth-logo" src="logo.png?v=20261008a" alt="中國醫藥大學附設醫院 師資培育中心 Center for Faculty Development" width="1263" height="170">
      <h1>臨床教師認證</h1>

      <!-- 主要入口：免登入查詢（多數同仁只需要查進度），與登入明確分開 -->
      <div id="authMain">
        <button id="goLookup" class="big-cta" type="button">
          <svg class="cta-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          <span class="cta-text"><b>查詢我的認證進度</b><small>免登入・輸入員工編號＋身分證後 4 碼</small></span>
          <span class="cta-arrow" aria-hidden="true">›</span>
        </button>

        <div class="or"><span>師培中心、科部主管及已開通帳號者</span></div>

      <div class="tabs" role="tablist">
        <button id="tabLogin" class="tab is-active" role="tab" type="button">登入</button>
        <button id="tabActivate" class="tab" role="tab" type="button">開通帳號</button>
      </div>

      <form id="loginForm" autocomplete="on">
        <label>員工編號<input id="loginEmp" type="text" autocomplete="username" required></label>
        <label>密碼<input id="loginPw" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary" type="submit">登入</button>
      </form>

      <form id="activateForm" hidden autocomplete="off">
        <p class="hint">第一次使用或忘記密碼：請輸入師培中心發給您的一次性開通碼，並自訂密碼。</p>
        <label>員工編號<input id="actEmp" type="text" required></label>
        <label>開通碼<input id="actCode" type="text" maxlength="8" required style="letter-spacing:.2em;text-transform:uppercase;"></label>
        <label>自訂密碼（至少 8 個字元）<input id="actPw" type="password" minlength="8" autocomplete="new-password" required></label>
        <label>再輸入一次<input id="actPw2" type="password" minlength="8" autocomplete="new-password" required></label>
        <button class="btn btn-primary" type="submit">開通並登入</button>
      </form>
      </div>

      <div id="lookupPane" hidden>
        <button id="lkBackLogin" class="btn-link" type="button">← 返回</button>
        <h2 class="lk-pane-title">查詢我的認證進度</h2>
      <form id="lookupForm" autocomplete="off">
        <p class="hint">不用帳號，即可查詢自己的認證狀態、效期、點數與修課紀錄（唯讀）。</p>
        <label>員工編號<input id="lkEmp" type="text" required></label>
        <label>身分證字號（或居留證號）最後 4 碼<input id="lkLast4" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off"></label>
        <button class="btn btn-primary" type="submit">查詢我的進度</button>
        <p class="hint">連續輸入錯誤 5 次會暫停查詢一段時間。</p>
      </form>
      </div>

      <p id="authMsg" class="msg" role="alert"></p>
    </div>
  </main>

  <!-- 免登入查詢結果（唯讀） -->
  <div id="lookupView" hidden>
    <header class="topbar">
      <div class="brand"><img class="brand-mark" src="logo-mark.png?v=20261008a" alt="" width="128" height="128">臨床教師認證｜進度查詢</div>
      <div class="who"><span id="lkWho"></span><button id="lkEnd" class="btn btn-ghost" type="button">結束查詢</button></div>
    </header>
    <main id="lkContent" class="content"></main>
    <footer class="foot">資料更新時間：<span id="lkAsOf">—</span>。如資料有疑問，請洽師培中心。</footer>
  </div>

  <!-- 主畫面 -->
  <div id="appView" hidden>
    <header class="topbar">
      <div class="brand"><img class="brand-mark" src="logo-mark.png?v=20261008a" alt="" width="128" height="128">臨床教師認證</div>
      <nav id="nav" class="nav"></nav>
      <div class="who">
        <span id="whoText"></span>
        <button id="pwBtn" class="btn btn-ghost" type="button">變更密碼</button>
        <button id="logoutBtn" class="btn btn-ghost" type="button">登出</button>
      </div>
    </header>
    <main id="content" class="content"></main>
    <footer class="foot">資料更新時間：<span id="asOf">—</span>。本站不存放姓名，以員工編號識別。</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="config.js?v=20261008a"></script>
  <script src="app.js?v=20261008a"></script>
</body>
</html>
